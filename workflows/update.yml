name: update-live-data
on:
  schedule:
    - cron: "7 * * * *"     # 毎時7分に実行
  workflow_dispatch: {}      # 手動実行ボタンも有効
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build live data
        run: node scripts/build-live.mjs
      - name: Write 5-min ops ledger
        run: node scripts/ops-ledger.mjs
      - name: Commit & push
        run: |
          git config user.name "mallowbrook-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: update live data" || echo "no changes"
          git push
